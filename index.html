<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Travlog</title>
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>

    <body>
        <header class="container">
            <div class="navbar">
                <a class="navbar__icon" href="#home" aria-label="Travlog Home">
                    <img
                        class="navbar__logo"
                        src="/assets/images/logo.png"
                        alt="Travlog Logo"
                    />
                </a>

                <div class="navbar__toggle-wrapper">
                    <button
                        class="navbar__toggle"
                        type="button"
                        aria-label="Open navigation menu"
                        aria-controls="primary-navigation"
                        aria-expanded="false"
                    >
                        <img
                            src="./public/assets/images/toggle.png"
                            alt="Menu Icon"
                        />
                    </button>
                </div>

                <nav
                    id="primary-navigation"
                    class="navbar__navigation"
                    aria-label="Main navigation"
                >
                    <ul class="navbar__menu">
                        <li class="navbar__item">
                            <a class="navbar__link" href="#home"> Home </a>
                        </li>
                        <li class="navbar__item">
                            <a class="navbar__link" href="#discover"
                                >Discover</a
                            >
                        </li>
                        <li class="navbar__item">
                            <a class="navbar__link" href="#deals"
                                >Special Deals</a
                            >
                        </li>
                        <li class="navbar__item">
                            <a class="navbar__link" href="#contact">Contact</a>
                        </li>
                    </ul>

                    <div class="navbar__drawer-buttons">
                        <a class="btn" href="#login">Log In</a>
                        <a class="btn btn--primary" href="#signup">Sign Up</a>
                    </div>
                </nav>

                <div class="navbar__backdrop" aria-hidden="true"></div>

                <div class="navbar__buttons">
                    <a class="btn" href="#login">Log In</a>
                    <a class="btn btn--primary" href="#signup">Sign Up</a>
                </div>
            </div>
        </header>

        <script src="./src/script/index.js"></script>
    </body>
</html>
