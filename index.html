<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Travlog</title>
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>

    <body>
        <header class="container">
            <div class="navbar">
                <a class="navbar__icon" href="#home" aria-label="Travlog Home">
                    <img
                        class="navbar__logo"
                        src="/assets/images/logo.svg"
                        alt="Travlog Logo"
                    />
                </a>

                <div class="navbar__toggle-wrapper">
                    <button
                        class="navbar__toggle"
                        type="button"
                        aria-label="Open navigation menu"
                        aria-controls="primary-navigation"
                        aria-expanded="false"
                    >
                        <img
                            src="./public/assets/images/hamburger.svg"
                            alt="Menu Icon"
                        />
                    </button>
                </div>

                <nav
                    id="primary-navigation"
                    class="navbar__navigation"
                    aria-label="Main navigation"
                >
                    <ul class="navbar__menu">
                        <li class="navbar__item">
                            <a class="navbar__link" href="#home"> Home </a>
                        </li>
                        <li class="navbar__item">
                            <a class="navbar__link" href="#discover">
                                Discover
                            </a>
                        </li>
                        <li class="navbar__item">
                            <a class="navbar__link" href="#deals">
                                Special Deals
                            </a>
                        </li>
                        <li class="navbar__item">
                            <a class="navbar__link" href="#contact">
                                Contact
                            </a>
                        </li>
                    </ul>

                    <div class="navbar__drawer-buttons">
                        <a class="btn" href="#login">Log In</a>
                        <a class="btn btn--primary" href="#signup">Sign Up</a>
                    </div>
                </nav>

                <div class="navbar__backdrop" aria-hidden="true"></div>

                <div class="navbar__buttons">
                    <a class="btn" href="#login">Log In</a>
                    <a class="btn btn--primary" href="#signup">Sign Up</a>
                </div>
            </div>
        </header>

        <main class="container">
            <section class="hero" aria-label="Travel destinations">
                <div class="hero__blur-div" aria-hidden="true"></div>

                <div
                    class="hero__gallery"
                    aria-label="Featured travel destinations"
                >
                    <div class="hero__images">
                        <div
                            class="hero__image-wrapper hero__image-wrapper--one"
                        >
                            <img
                                class="hero__image"
                                src="/assets/images/travel-1.jpg"
                                alt="Beautiful coastal destination with white buildings and blue sea"
                            />
                        </div>

                        <div
                            class="hero__image-wrapper hero__image-wrapper--two"
                        >
                            <img
                                class="hero__image"
                                src="/assets/images/travel-2.jpg"
                                alt="Traveler enjoying a mountain landscape"
                            />
                        </div>

                        <div
                            class="hero__image-wrapper hero__image-wrapper--three"
                        >
                            <img
                                class="hero__image"
                                src="/assets/images/travel-3.jpg"
                                alt="Traveler exploring a city"
                            />
                        </div>

                        <div
                            class="hero__icon hero__icon--send"
                            aria-hidden="true"
                        >
                            <img src="/assets/images/send.svg" alt="" />
                        </div>

                        <div
                            class="hero__icon hero__icon--add-user"
                            aria-hidden="true"
                        >
                            <img src="/assets/images/add-user.svg" alt="" />
                        </div>

                        <div class="hero__top-places">
                            <img src="/assets/images/location.svg" alt="" />
                            <span>Top Places</span>
                        </div>
                    </div>
                </div>

                <div class="hero__content">
                    <div class="hero__explore">
                        <span class="hero__explore-text">
                            Explore the world!
                        </span>

                        <img
                            class="hero__explore-icon"
                            src="/assets/images/briefcase.png"
                            alt=""
                            aria-hidden="true"
                        />
                    </div>

                    <div class="hero__text">
                        <h1 class="heading--xl hero__heading">
                            Travel
                            <span class="hero__title-highlight">top</span>

                            <span
                                class="hero__line-break hero__line-break--top"
                                aria-hidden="true"
                            ></span>

                            <span class="hero__title-highlight">
                                destination
                            </span>

                            <span
                                class="hero__line-break hero__line-break--destination"
                                aria-hidden="true"
                            ></span>

                            of the

                            <span
                                class="hero__line-break hero__line-break--world"
                                aria-hidden="true"
                            ></span>

                            world
                        </h1>

                        <p class="paragraph hero__paragraph">
                            We always make our customer happy by
                            <span
                                class="hero__line-break hero__line-break--happy"
                                aria-hidden="true"
                            ></span>
                            providing
                            <span
                                class="hero__line-break hero__line-break--choices"
                                aria-hidden="true"
                            ></span>
                            as many choices as possible.
                        </p>
                    </div>

                    <div class="hero__buttons">
                        <a
                            href="#get-started"
                            class="btn btn--primary hero__button hero__get-started-button"
                            aria-label="Get started with your travel journey"
                        >
                            Get Started
                        </a>

                        <a
                            href="#watch-demo"
                            class="btn hero__button hero__demo-button"
                            aria-label="Watch the travel website demo"
                        >
                            <img
                                class="hero__play-icon"
                                src="/assets/images/circle-play-solid-full.svg"
                                alt=""
                                aria-hidden="true"
                            />
                            Watch Demo
                        </a>
                    </div>
                </div>

                <div class="hero__triangles" aria-hidden="true">
                    <img
                        src="/assets/images/side-triangles.png"
                        alt="decorative-triangles"
                    />
                </div>
            </section>

            <section class="branding">
                <div class="branding__row branding__row--first">
                    <img
                        class="branding__image"
                        src="./public/assets/images/TripAdvisor.png"
                        alt="TripAdvisor"
                    />
                    <img
                        class="branding__image"
                        src="./public/assets/images/Expedia.png"
                        alt="Expedia"
                    />
                    <img
                        class="branding__image"
                        src="./public/assets/images/Booking.png"
                        alt="Booking.com"
                    />
                </div>

                <div class="branding__row branding__row--second">
                    <img
                        class="branding__image"
                        src="./public/assets/images/AirBNB.png"
                        alt="Airbnb"
                    />
                    <img
                        class="branding__image"
                        src="./public/assets/images/Gabitz.png"
                        alt="Gabitz"
                    />
                </div>
            </section>
        </main>

        <script src="./src/script/index.js"></script>
    </body>
</html>
